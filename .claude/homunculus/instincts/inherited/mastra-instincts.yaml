# Mastra Workflow Add Or Update Api Endpoint

## Action

Follow the add-or-update-api-endpoint workflow:
1. Create or update handler file in packages/server/src/server/handlers/ (e.g., responses.ts, conversations.ts).
2. Update or create corresponding schema in packages/server/src/server/schemas/.
3. Add or update tests in packages/server/src/server/handlers/*.test.ts.
4. Update or create route in packages/server/src/server/server-adapter/routes/.
5. Update client SDKs if needed (e.g., client-sdks/client-js/src/resources/).
6. Update documentation in docs/src/content/en/reference/client-js/ or similar.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/server/src/server/handlers/*.ts, packages/server/src/server/handlers/*.test.ts, packages/server/src/server/schemas/*.ts

