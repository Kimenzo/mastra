# Mastra Workflow Feature Addition With Tests And Docs

## Action

Follow the feature-addition-with-tests-and-docs workflow:
1. Implement feature in relevant src/ files.
2. Add or update corresponding test files (often __tests__/*.test.ts or *.test.ts).
3. Update or add documentation files (docs/src/content/en/... or README.md).
4. Add a .changeset/*.md entry describing the feature.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~5x per month
- Files: packages/*/src/**/*.ts, packages/*/src/**/*.test.ts, packages/*/src/**/__tests__/*.test.ts

