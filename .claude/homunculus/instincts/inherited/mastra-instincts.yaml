# Mastra Workflow Version Bump And Release

## Action

Follow the version-bump-and-release workflow:
1. Update .changeset/pre.json to enter/exit prerelease mode or as part of a version bump.
2. Update multiple package.json and CHANGELOG.md files across packages.
3. Add or update .changeset/*.md files describing changes.
4. Commit all version/changelog/changeset changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~8x per month
- Files: .changeset/pre.json, .changeset/*.md, */CHANGELOG.md

